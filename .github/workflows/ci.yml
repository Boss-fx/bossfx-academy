name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: JS & JSON syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax (Node scripts)
        run: |
          find api lib -name '*.js' | while read f; do
            node --check "$f" || exit 1
          done

      - name: Check JSON syntax
        run: |
          find . -name '*.json' -not -path './node_modules/*' -not -path './.vercel/*' | while read f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done

  html-validate:
    name: HTML well-formedness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check HTML files parse without errors
        run: |
          npm install -g htmlhint@1.1.4
          # Rules live in .htmlhintrc (auto-loaded). The previous `--config -`
          # (stdin) form was ignored by htmlhint, so it fell back to defaults and
          # failed on valid SVG camelCase + unescaped & in pre-existing files,
          # which silently blocked every deploy. Utility/content subdirs (email
          # templates, data files, blog archive) are excluded from the strict pass.
          htmlhint --ignore "docs/**,resources/**,blog/**" "**/*.html"

  api-test:
    name: API endpoint smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Require all API handlers
        run: |
          for f in api/*.js; do
            echo "Requiring $f..."
            node -e "require('./$f')" || exit 1
          done

  links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check internal links resolve
        run: node scripts/check-links.js

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit dependencies (report-only, never blocks)
        # Known advisories are all in the dev-only live-server toolchain, which
        # never ships to production. `|| true` keeps this job green so it surfaces
        # risk in the logs without ever gating a deploy. Review the output and, if
        # a production dependency appears, raise the gate.
        run: |
          echo "::group::Production dependency audit (high+)"
          npm audit --omit=dev --audit-level=high || true
          echo "::endgroup::"
          echo "::group::Full audit (incl. dev tooling — informational)"
          npm audit || true
          echo "::endgroup::"
