<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Lesson — BossFx Academy</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#090909;color:#e2e8f0;font-family:'Inter',-apple-system,sans-serif;line-height:1.65;min-height:100vh}
  a{color:#34d399;text-decoration:none}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #1e1e1e;max-width:920px;margin:0 auto}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:#fff}
  .brand span{color:#10b981}
  .wrap{max-width:920px;margin:0 auto;padding:36px 24px 80px}
  .crumb{font-size:0.82rem;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:1.7rem;color:#fff;margin-bottom:22px;line-height:1.25}
  .video{position:relative;width:100%;aspect-ratio:16/9;background:#0f0f0f;border:1px solid #262626;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video-ph{text-align:center;color:#64748b;padding:20px}
  .video-ph strong{display:block;color:#94a3b8;margin-bottom:6px;font-size:1rem}
  .actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;font-weight:700;font-size:0.95rem;padding:13px 22px;cursor:pointer;font-family:inherit}
  .btn-done{background:#10b981;color:#04120b}
  .btn-done.is-done{background:transparent;border:1px solid #10b981;color:#34d399}
  .btn-ghost{background:transparent;border:1px solid #334155;color:#e2e8f0}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:34px;border-top:1px solid #1e1e1e;padding-top:22px}
  .navrow a{font-size:0.9rem;color:#94a3b8}
  .navrow a:hover{color:#34d399}
  .muted{color:#94a3b8}
  .center{text-align:center;padding:80px 20px}
  .hide{display:none!important}
</style>
</head>
<body>
  <div class="top">
    <a href="/" class="brand">BossFx <span>Academy</span></a>
    <a href="index.html" class="muted" style="font-size:0.9rem">My Learning</a>
  </div>

  <div class="wrap hide" id="gate"><p class="muted center">Checking your access…</p></div>

  <div class="wrap hide" id="lessonView">
    <div class="crumb" id="crumb"></div>
    <h1 id="title"></h1>
    <div class="video" id="video"></div>
    <div class="actions">
      <button class="btn btn-done" id="doneBtn" type="button">Mark complete</button>
      <span class="muted" id="doneMsg" style="font-size:0.88rem"></span>
    </div>
    <div class="navrow">
      <a id="prevLink" href="#">← Previous</a>
      <a href="index.html">All modules</a>
      <a id="nextLink" href="#">Next →</a>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../lib/vendor/supabase.umd.js"></script>
  <script src="../services/auth-service.js"></script>
  <script src="learn.js"></script>
  <script>
  (function () {
    var qs = new URLSearchParams(location.search);
    var courseId = qs.get('course') || 'forex-101';
    var lessonId = qs.get('lesson') || 'module-01';
    var gate = document.getElementById('gate'), view = document.getElementById('lessonView');
    function show(el){ gate.classList.toggle('hide', el!==gate); view.classList.toggle('hide', el!==view); }
    show(gate);

    if (!BFX.learn.ready()) { gate.innerHTML = '<p class="muted center">The learning area isn\'t configured on this deployment yet.</p>'; return; }

    var info = BFX.learn.lesson(courseId, lessonId);
    if (!info) { gate.innerHTML = '<p class="muted center">Lesson not found. <a href="index.html">Back to My Learning</a></p>'; return; }

    BFX.learn.currentUser().then(function (user) {
      if (!user) { location.replace('index.html'); return; }  // gate: must be signed in
      return BFX.learn.isEnrolled(courseId).then(function (enrolled) { render(user, enrolled); });
    });

    function render(user, enrolled) {
      document.getElementById('crumb').textContent = info.course.title + ' · Module ' + info.lesson.n;
      document.getElementById('title').textContent = info.lesson.title;

      // Paywall: a non-free module you haven't purchased shows an upsell.
      if (!BFX.learn.canAccess(info.lesson, enrolled)) {
        document.getElementById('video').innerHTML =
          '<div class="video-ph"><strong>🔒 This module is part of the full course</strong>' +
          'Modules 1–' + info.course.freeCount + ' are free. Unlock all 12 modules, lifetime access and the community.</div>';
        var act = document.querySelector('.actions');
        act.innerHTML = '<a class="btn btn-done" href="' + info.course.enrollUrl + '">Enroll — ₦' + info.course.priceNGN.toLocaleString() + ' →</a>' +
          '<a class="btn btn-ghost" href="index.html">Back to My Learning</a>';
        var pv = document.getElementById('prevLink'), nx = document.getElementById('nextLink');
        pv.classList.add('hide'); nx.classList.add('hide');
        show(view);
        return;
      }

      var v = document.getElementById('video');
      if (info.lesson.video) {
        v.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + info.lesson.video + '" title="Lesson video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      } else {
        v.innerHTML = '<div class="video-ph"><strong>🎬 Lesson video coming soon</strong>Video for this module hasn\'t been uploaded yet. Your progress still tracks — mark it complete once you\'ve studied the module.</div>';
      }

      var prev = document.getElementById('prevLink'), next = document.getElementById('nextLink');
      if (info.prev) prev.href = 'lesson.html?course=' + courseId + '&lesson=' + info.prev.id; else prev.classList.add('hide');
      if (info.next) next.href = 'lesson.html?course=' + courseId + '&lesson=' + info.next.id; else next.classList.add('hide');

      var btn = document.getElementById('doneBtn'), dmsg = document.getElementById('doneMsg');
      var isDone = false;
      function paint() {
        btn.classList.toggle('is-done', isDone);
        btn.textContent = isDone ? '✓ Completed' : 'Mark complete';
      }
      BFX.learn.getProgress(courseId).then(function (done) { isDone = !!done[lessonId]; paint(); });

      btn.onclick = function () {
        btn.disabled = true;
        var target = !isDone;
        BFX.learn.markComplete(user.id, courseId, lessonId, target).then(function (res) {
          if (res && res.error) throw res.error;
          isDone = target; paint();
          dmsg.textContent = target ? 'Saved to your progress.' : 'Marked incomplete.';
          setTimeout(function(){ dmsg.textContent=''; }, 2500);
        }).catch(function (err) {
          dmsg.textContent = 'Could not save: ' + ((err && err.message) || 'error');
        }).then(function(){ btn.disabled = false; });
      };

      show(view);
    }
  })();
  </script>
</body>
</html>
