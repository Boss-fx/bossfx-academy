<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>My Learning — BossFx Academy</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#090909;color:#e2e8f0;font-family:'Inter',-apple-system,sans-serif;line-height:1.6;min-height:100vh}
  a{color:#34d399;text-decoration:none}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #1e1e1e;max-width:1000px;margin:0 auto}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;color:#fff}
  .brand span{color:#10b981}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 24px}
  .muted{color:#94a3b8}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#10b981;color:#04120b;border:none;border-radius:10px;font-weight:700;font-size:0.95rem;padding:13px 22px;cursor:pointer;font-family:inherit}
  .btn:hover{background:#00d46a}
  .btn-ghost{background:transparent;border:1px solid #334155;color:#e2e8f0}
  .btn-ghost:hover{border-color:#10b981;color:#34d399}
  /* auth */
  .auth-card{max-width:420px;margin:60px auto 0;background:#151515;border:1px solid #262626;border-radius:18px;padding:36px}
  .auth-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;margin-bottom:6px;color:#fff}
  .auth-card p.sub{color:#94a3b8;font-size:0.92rem;margin-bottom:24px}
  .field{margin-bottom:14px}
  .field input{width:100%;padding:13px 15px;background:rgba(255,255,255,0.04);border:1px solid #333;border-radius:10px;color:#fff;font-size:0.95rem;font-family:inherit;outline:none}
  .field input:focus{border-color:#10b981}
  .auth-switch{margin-top:18px;text-align:center;font-size:0.9rem;color:#94a3b8}
  .msg{margin:10px 0 0;font-size:0.85rem;min-height:18px}
  .msg.err{color:#f87171}.msg.ok{color:#34d399}
  .tabs{display:flex;gap:8px;margin-bottom:22px;background:#0f0f0f;border:1px solid #262626;border-radius:12px;padding:4px}
  .tabs button{flex:1;padding:10px;background:transparent;border:none;border-radius:9px;color:#94a3b8;font-weight:600;font-size:0.9rem;cursor:pointer;font-family:inherit}
  .tabs button.active{background:#10b981;color:#04120b}
  .btn-google{margin-bottom:6px}
  .or-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#64748b;font-size:0.8rem}
  .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:#262626}
  /* dashboard */
  .dash-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px}
  .dash-head h1{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;color:#fff}
  .course-card{background:#151515;border:1px solid #262626;border-radius:18px;padding:32px;margin-top:28px}
  .course-card h2{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;color:#fff;margin-bottom:6px}
  .progress-bar{height:8px;background:#1e1e1e;border-radius:6px;overflow:hidden;margin:18px 0 6px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#10b981,#00d46a);width:0;transition:width .5s}
  .progress-label{font-size:0.82rem;color:#94a3b8;margin-bottom:20px}
  .lesson-list{list-style:none}
  .lesson-item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid #1e1e1e}
  .lesson-item:first-child{border-top:none}
  .lesson-check{width:26px;height:26px;border-radius:50%;border:2px solid #334155;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:#04120b}
  .lesson-check.done{background:#10b981;border-color:#10b981}
  .lesson-item .l-title{flex:1;color:#e2e8f0;font-size:0.98rem}
  .lesson-item .l-title small{display:block;color:#64748b;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase}
  .lesson-item a.l-go{color:#34d399;font-size:0.85rem;font-weight:600;white-space:nowrap}
  .lesson-item.locked .l-title{color:#64748b}
  .lesson-check{font-size:0.7rem}
  a.l-lock{color:#f59e0b!important}
  .l-free{display:inline-block;margin-left:8px;color:#34d399;font-style:normal;font-size:0.68rem;letter-spacing:0.5px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);padding:1px 6px;border-radius:20px;vertical-align:middle}
  .enroll-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(245,158,11,0.1),rgba(16,185,129,0.08));border:1px solid rgba(245,158,11,0.35);border-radius:14px;padding:18px 20px;margin:4px 0 22px}
  .enroll-banner strong{display:block;color:#fff;font-size:1rem;margin-bottom:2px}
  .enroll-banner span{color:#94a3b8;font-size:0.86rem}
  .enroll-banner .btn{white-space:nowrap}
  .hide{display:none!important}
  .center{text-align:center}
</style>
</head>
<body>
  <div class="top">
    <a href="/" class="brand">BossFx <span>Academy</span></a>
    <div id="topRight"><a href="/" class="muted" style="font-size:0.9rem">← Back to site</a></div>
  </div>

  <!-- AUTH (logged out) -->
  <div class="wrap" id="authView">
    <div class="auth-card">
      <div class="tabs">
        <button id="tabLogin" class="active" type="button">Log in</button>
        <button id="tabSignup" type="button">Create account</button>
      </div>
      <h1 id="authTitle">Welcome back, Trader</h1>
      <p class="sub" id="authSub">Log in to continue your learning.</p>
      <button class="btn btn-ghost btn-google" id="googleBtn" type="button" style="width:100%">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div class="or-divider"><span>or</span></div>
      <form id="authForm">
        <div class="field" id="nameField" style="display:none"><input id="fName" type="text" placeholder="Your name" autocomplete="name"></div>
        <div class="field"><input id="fEmail" type="email" placeholder="Email address" autocomplete="email" required></div>
        <div class="field"><input id="fPass" type="password" placeholder="Password (min 6 chars)" autocomplete="current-password" required></div>
        <button class="btn" type="submit" id="authBtn" style="width:100%">Log in</button>
        <p class="msg" id="authMsg"></p>
      </form>
      <p class="auth-switch" id="authSwitch">New here? <a href="#" id="goSignup">Create a free account →</a></p>
    </div>
  </div>

  <!-- DASHBOARD (logged in) -->
  <div class="wrap hide" id="dashView">
    <div class="dash-head">
      <h1>My Learning</h1>
      <button class="btn btn-ghost" id="logoutBtn" type="button">Log out</button>
    </div>
    <p class="muted" id="welcome"></p>
    <div id="courses"></div>
  </div>

  <div class="wrap hide" id="loadingView"><p class="muted center">Loading…</p></div>

  <script src="../config.js"></script>
  <script src="../lib/vendor/supabase.umd.js"></script>
  <script src="../services/auth-service.js"></script>
  <script src="learn.js"></script>
  <script>
  (function () {
    var els = {
      auth: document.getElementById('authView'),
      dash: document.getElementById('dashView'),
      loading: document.getElementById('loadingView'),
      form: document.getElementById('authForm'),
      email: document.getElementById('fEmail'),
      pass: document.getElementById('fPass'),
      name: document.getElementById('fName'),
      nameField: document.getElementById('nameField'),
      btn: document.getElementById('authBtn'),
      msg: document.getElementById('authMsg'),
      google: document.getElementById('googleBtn'),
      title: document.getElementById('authTitle'),
      sub: document.getElementById('authSub'),
      tabLogin: document.getElementById('tabLogin'),
      tabSignup: document.getElementById('tabSignup'),
      switch: document.getElementById('authSwitch'),
      welcome: document.getElementById('welcome'),
      courses: document.getElementById('courses'),
      logout: document.getElementById('logoutBtn')
    };
    var mode = 'login';

    if (!BFX.learn.ready()) {
      show('auth');
      setMsg('Auth is not configured on this deployment yet.', 'err');
      return;
    }

    function show(v) {
      els.auth.classList.toggle('hide', v !== 'auth');
      els.dash.classList.toggle('hide', v !== 'dash');
      els.loading.classList.toggle('hide', v !== 'loading');
    }
    function setMsg(t, cls) { els.msg.textContent = t || ''; els.msg.className = 'msg ' + (cls || ''); }

    function setMode(m) {
      mode = m;
      var login = m === 'login';
      els.tabLogin.classList.toggle('active', login);
      els.tabSignup.classList.toggle('active', !login);
      els.title.textContent = login ? 'Welcome back, Trader' : 'Create your free account';
      els.sub.textContent = login ? 'Log in to continue your learning.' : 'Track your progress through every module — free.';
      els.btn.textContent = login ? 'Log in' : 'Create account';
      els.nameField.style.display = login ? 'none' : 'block';
      els.switch.innerHTML = login
        ? 'New here? <a href="#" id="goSignup">Create a free account →</a>'
        : 'Already have an account? <a href="#" id="goLogin">Log in →</a>';
      wireSwitch();
      setMsg('');
    }
    function wireSwitch() {
      var s = document.getElementById('goSignup'), l = document.getElementById('goLogin');
      if (s) s.onclick = function (e) { e.preventDefault(); setMode('signup'); };
      if (l) l.onclick = function (e) { e.preventDefault(); setMode('login'); };
    }
    els.tabLogin.onclick = function () { setMode('login'); };
    els.tabSignup.onclick = function () { setMode('signup'); };
    wireSwitch();

    els.form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = els.email.value.trim(), pass = els.pass.value;
      if (!email || pass.length < 6) { setMsg('Enter a valid email and a 6+ character password.', 'err'); return; }
      els.btn.disabled = true; els.btn.textContent = mode === 'login' ? 'Logging in…' : 'Creating…';
      var p = mode === 'login'
        ? BFX.auth.signInWithPassword(email, pass)
        : BFX.auth.signUp(email, pass, { full_name: els.name.value.trim() });
      p.then(function (res) {
        if (res && res.error) throw res.error;
        if (mode === 'signup' && res.data && !res.data.session) {
          setMsg('Account created — check your email to confirm, then log in.', 'ok');
          els.btn.disabled = false; els.btn.textContent = 'Create account'; setMode('login'); return;
        }
        boot();
      }).catch(function (err) {
        setMsg((err && err.message) || 'Something went wrong.', 'err');
        els.btn.disabled = false; els.btn.textContent = mode === 'login' ? 'Log in' : 'Create account';
      });
    });

    els.google.onclick = function () {
      els.google.disabled = true;
      setMsg('Redirecting to Google…', '');
      BFX.auth.signInWithOAuth('google', location.origin + '/learn/').then(function (res) {
        if (res && res.error) throw res.error;   // otherwise the browser navigates away to Google
      }).catch(function (err) {
        els.google.disabled = false;
        setMsg((err && err.message) || 'Could not start Google sign-in.', 'err');
      });
    };

    els.logout.onclick = function () { BFX.auth.signOut().then(function () { location.reload(); }); };

    function renderCourse(user) {
      var cid = 'forex-101', c = BFX.learn.course(cid);
      Promise.all([BFX.learn.getProgress(cid), BFX.learn.isEnrolled(cid)]).then(function (r) {
        var done = r[0], enrolled = r[1];
        var total = c.lessons.length, doneCount = 0;
        var rows = c.lessons.map(function (ls) {
          var open = BFX.learn.canAccess(ls, enrolled);
          var isDone = open && !!done[ls.id]; if (isDone) doneCount++;
          var tag = ls.free ? '<em class="l-free">Free</em>' : '';
          var action = open
            ? '<a class="l-go" href="lesson.html?course=' + cid + '&lesson=' + ls.id + '">' + (isDone ? 'Review' : 'Start') + ' →</a>'
            : '<a class="l-go l-lock" href="' + c.enrollUrl + '">🔒 Unlock</a>';
          return '<li class="lesson-item' + (open ? '' : ' locked') + '">' +
            '<span class="lesson-check ' + (isDone ? 'done' : '') + '">' + (isDone ? '✓' : (open ? '' : '🔒')) + '</span>' +
            '<span class="l-title"><small>Module ' + ls.n + tag + '</small>' + esc(ls.title) + '</span>' +
            action +
          '</li>';
        }).join('');
        var pct = total ? Math.round(doneCount / total * 100) : 0;
        var banner = enrolled ? '' :
          '<div class="enroll-banner">' +
          '<div><strong>Unlock the full course</strong><span>Modules 1–' + c.freeCount + ' are free. Get all 12 modules, lifetime access & the community.</span></div>' +
          '<a class="btn" href="' + c.enrollUrl + '">Enroll — ₦' + c.priceNGN.toLocaleString() + ' →</a></div>';
        els.courses.innerHTML =
          '<div class="course-card"><h2>' + esc(c.title) + '</h2><p class="muted">' + esc(c.blurb) + '</p>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<p class="progress-label">' + doneCount + ' of ' + total + ' modules complete · ' + pct + '%' +
          (enrolled ? ' · <span style="color:#34d399">Full access ✓</span>' : ' · Free preview') + '</p>' +
          banner +
          '<ul class="lesson-list">' + rows + '</ul></div>';
      }).catch(function () {
        els.courses.innerHTML = '<div class="course-card"><p class="muted">Couldn\'t load your progress. Refresh to try again.</p></div>';
      });
    }

    function boot() {
      show('loading');
      BFX.learn.currentUser().then(function (user) {
        if (!user) { show('auth'); return; }
        var nm = (user.user_metadata && user.user_metadata.full_name) || user.email;
        els.welcome.textContent = 'Signed in as ' + nm + '. Pick up where you left off.';
        renderCourse(user);
        show('dash');
      });
    }
    function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

    boot();
  })();
  </script>
</body>
</html>
